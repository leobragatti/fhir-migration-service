services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    volumes:
      - ./backend:/app
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://myapp:myapp@db:5432/myapp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build: ./backend
    volumes:
      - ./backend/app:/app
    command: rq worker
    environment:
      - REDIS_URL=redis://redis
      - DATABASE_URL=postgresql+psycopg://myapp:myapp@db:5432/myapp
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://myapp:myapp@db:5432/myapp
      - REDIS_URL=redis://redis
    command: uvicorn main:app --host 0.0.0.0 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.expo
    environment:
      # Called from the browser on the host, so it's the backend's published port
      - EXPO_PUBLIC_API_URL=http://localhost:8000

volumes:
  redis_data:
